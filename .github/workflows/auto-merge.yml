name: Auto Merge RefactorModels & resources ke Controller

on:
  push:
    branches: [RefactorModels, resources]
  # Opsional: bisa dijalankan manual dari tab Actions
  workflow_dispatch:

# Minimal permission: hanya butuh write ke content (code)
permissions:
  contents: write

jobs:
  # JOB 1: Merge dari branch RefactorModels ke controllers
  merge-refactormodels:
    name: Merge RefactorModels → controllers
    if: github.ref_name == 'RefactorModels'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout semua branch dengan full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Java 25 LTS (Eclipse Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: maven
      
      - name: Setup Maven Wrapper (jika belum punya)
        run: |
          if [ ! -f mvnw ]; then
            mvn -B wrapper:wrapper
          fi
      
      - name: Merge dari RefactorModels ke controllers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Pindah ke branch target
          git checkout controllers || git checkout -b controllers
          
          # Pull versi terbaru
          git pull origin controllers
          
          # Lakukan merge
          git merge origin/RefactorModels \
            --no-ff \
            -m "merge: RefactorModels → controllers [skip ci]"
      
      - name: Compile Check (Maven)
        id: compile
        run: |
          ./mvnw clean compile -B --no-transfer-progress
        continue-on-error: true
      
      - name: Push ke controllers jika sukses
        if: steps.compile.outcome == 'success'
        run: |
          git push origin controllers
          echo "Berhasil merge RefactorModels → controllers & compile OK"
      
      - name: Rollback jika compile gagal
        if: steps.compile.outcome == 'failure'
        run: |
          echo "COMPILE ERROR! Rollback merge..."
          git merge --abort
          echo ""
          echo "Cara fix manual:"
          echo "1. git checkout controllers"
          echo "2. git merge origin/RefactorModels"
          echo "3. Fix conflict/compile error, lalu git commit"
          echo "4. git push origin controllers"
          exit 1

  # JOB 2: Merge dari branch resources ke controllers
  merge-resources:
    name: Merge resources → controllers
    if: github.ref_name == 'resources'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout semua branch dengan full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Java 25 LTS (Eclipse Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: maven
      
      - name: Setup Maven Wrapper
        run: |
          if [ ! -f mvnw ]; then
            mvn -B wrapper:wrapper
          fi
      
      - name: Merge dari resources ke controllers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout controllers || git checkout -b controllers
          git pull origin controllers
          git merge origin/resources \
            --no-ff \
            -m "merge: resources → controllers [skip ci]"
      
      - name: Compile Check (Maven)
        id: compile
        run: |
          ./mvnw clean compile -B --no-transfer-progress
        continue-on-error: true
      
      - name: Push ke controllers jika sukses
        if: steps.compile.outcome == 'success'
        run: |
          git push origin controllers
          echo "Berhasil merge resources → controllers & compile OK"
      
      - name: Rollback jika compile gagal
        if: steps.compile.outcome == 'failure'
        run: |
          echo "COMPILE ERROR! Rollback merge..."
          git merge --abort
          echo ""
          echo "Cara fix manual:"
          echo "1. git checkout controllers"
          echo "2. git merge origin/resources"
          echo "3. Fix conflict/compile error, lalu git commit"
          echo "4. git push origin controllers"
          exit 1